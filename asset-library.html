<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT ELEVEN — کتابخانه تصاویر خیالی</title><style>*{box-sizing:border-box}body{margin:0;background:#050b16;color:#eaf3ff;font-family:Tahoma,Arial,sans-serif}header{padding:22px 16px;background:linear-gradient(135deg,#0b1f46,#07101f);border-bottom:1px solid #17416a}h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:auto;padding:16px}p{color:#a8c2df;line-height:1.8}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}select,input,button{background:#0b1830;color:#eaf3ff;border:1px solid #23517b;padding:11px;border-radius:9px;font-size:14px}button{background:#1267a8;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.card{background:#091426;border:1px solid #173c60;border-radius:13px;overflow:hidden}.card img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}.label{padding:10px;font-size:13px}.muted{font-size:11px;color:#8aa9c8}</style></head><body><header><div class="wrap"><h1>PROJECT ELEVEN | کتابخانه دنیای خیالی</h1><p>دارایی‌های ساختگی و تولیدشونده در مرورگر؛ بدون API و بدون نام یا نشان واقعی فوتبال.</p></div></header><main class="wrap"><div class="controls"><select id="type"><option value="player">بازیکنان</option><option value="club">لوگوهای باشگاه</option><option value="stadium">ورزشگاه‌ها</option><option value="kit">لباس تیم‌ها</option><option value="coach">مربیان</option><option value="trophy">جام‌ها</option><option value="icon">آیکون‌ها</option></select><input id="start" type="number" min="0" value="1"><select id="amount"><option>12</option><option>24</option><option>48</option><option>100</option></select><button id="show">نمایش تصاویر</button><button id="more">بسته بعدی</button></div><p id="status"></p><section id="grid" class="grid"></section></main><script src="assets/project-eleven-assets.js"></script><script>let start=1;function draw(){const type=document.querySelector('#type').value;start=Math.max(0,Number(document.querySelector('#start').value)||0);const amount=Number(document.querySelector('#amount').value),grid=document.querySelector('#grid');grid.innerHTML='';for(let i=start;i<start+amount;i++){const card=document.createElement('article');card.className='card';const img=document.createElement('img');ProjectElevenAssets.render(img,type,i);const label=document.createElement('div');label.className='label';label.textContent=({player:'بازیکن ',club:'باشگاه ',stadium:'ورزشگاه ',kit:'لباس ',coach:'مربی ',trophy:'جام ',icon:'آیکون '})[type]+i;const small=document.createElement('div');small.className='muted';small.textContent='شناسه اختصاصی: '+type+'-'+i;label.append(document.createElement('br'),small);card.append(img,label);grid.append(card)}document.querySelector('#status').textContent='نمایش '+amount+' مورد از مجموعه تولیدشونده؛ با تغییر شماره شروع، تصاویر بیشتری بساز.';document.querySelector('#start').value=start}document.querySelector('#show').onclick=draw;document.querySelector('#more').onclick=()=>{start+=Number(document.querySelector('#amount').value);document.querySelector('#start').value=start;draw()};draw();</script></body></html>
