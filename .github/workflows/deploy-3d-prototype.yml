name: Deploy PROJECT ELEVEN 3D prototype

on:
  push:
    branches:
      - 3d-match-prototype
    paths:
      - "3d-match-prototype/**"
      - ".github/workflows/deploy-3d-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-3d-prototype
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package standalone prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./3d-match-prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
