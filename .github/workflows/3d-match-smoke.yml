name: 3D Match Browser Smoke Test
on:
  push:
    branches: [ai/babylon-match-sim, ai/live-match-league-sync, ai/stabilize-match-clock-test, ai/real-fulltime-integration-v2, main]
    paths:
      - '3d-match-prototype/**'
      - '.github/workflows/3d-match-smoke.yml'
      - 'tests/3d-match-smoke.cjs'
      - 'tests/3d-match-long.cjs'
      - 'tests/game-integration-smoke.cjs'
      - 'js/game.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve prototype
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/project-eleven-http.log 2>&1 &
      - name: Run browser smoke test
        run: node tests/3d-match-smoke.cjs
      - name: Run extended full-match test
        run: node tests/3d-match-long.cjs
      - name: Run main game integration test
        run: node tests/game-integration-smoke.cjs
